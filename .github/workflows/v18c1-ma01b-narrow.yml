name: 1.8C MA01B CCD narrowphase H1
on:
  push:
    branches: [engineering/v18c1-ma01b-narrowphase-h1]
  pull_request:
  workflow_dispatch:
jobs:
  ctest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          cmake -S . -B /tmp/ma01b -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ma01b --parallel 2
          ctest --test-dir /tmp/ma01b --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/shared src/shared/nf_contact18a.c src/shared/nf_contact18a2.c src/shared/nf_contact18a3.c src/shared/nf_contact18a4.c src/shared/nf_multi_broad18c1.c src/shared/nf_multi_narrow18c1.c src/tests/test_multi_narrow18c1.c -lm -o /tmp/ma01b_san
          ASAN_OPTIONS=detect_leaks=0 /tmp/ma01b_san
