name: 1.8C.1 multi-actor authority A4 H1
on:
  push:
    branches: [engineering/v18c1-multiactor-a4-authority-h1]
  pull_request:
  workflow_dispatch:
jobs:
  multi-a4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          git rev-parse HEAD
          cmake -S . -B /tmp/multi_a4 -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build /tmp/multi_a4 --parallel 2
          ctest --test-dir /tmp/multi_a4 --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/shared src/shared/nf_contact18a.c src/shared/nf_contact18a2.c src/shared/nf_contact18a3.c src/shared/nf_contact18a4.c src/shared/nf_multi18c1.c src/tests/test_multi18c1.c -lm -o /tmp/multi_san
          ASAN_OPTIONS=detect_leaks=0 /tmp/multi_san
