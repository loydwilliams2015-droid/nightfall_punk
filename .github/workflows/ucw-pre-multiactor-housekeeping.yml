name: UCW pre-multiactor codec housekeeping
on:
  push:
    branches: [engineering/v18c-pre-multiactor-codec-housekeeping-h0]
  pull_request:
  workflow_dispatch:
jobs:
  codec-and-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          git rev-parse HEAD
          cmake -S . -B /tmp/ucw_maint -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ucw_maint --parallel 2
          ctest --test-dir /tmp/ucw_maint --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/shared src/shared/nf_ucw_codec18c.c src/tests/test_ucw_codec18c.c -o /tmp/ucw_codec_san
          ASAN_OPTIONS=detect_leaks=0 /tmp/ucw_codec_san
