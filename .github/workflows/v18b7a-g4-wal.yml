name: 1.8B.7A Group 4 N01 POSIX journal laboratory
on:
  push:
    branches:
      - build/v18b7a-g4-persistence-performance-h0
  pull_request:
  workflow_dispatch:
jobs:
  wal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Record source SHA256
        run: sha256sum src/shared/nf_wal18b7.h src/shared/nf_wal18b7.c src/tests/test_wal18b7.c src/shared/nf_governor18b7.h src/shared/nf_governor18b7.c src/tests/test_governor18b7.c
      - name: Compile and run real filesystem recovery fixtures
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -eux
          "$CC" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DNF4_TESTING \
            -Isrc/shared src/shared/nf_wal18b7.c src/tests/test_wal18b7.c \
            -o /tmp/nf4_wal
          /tmp/nf4_wal
          "$CC" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/shared src/shared/nf_governor18b7.c src/tests/test_governor18b7.c \
            -o /tmp/nf4_governor
          /tmp/nf4_governor
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GCC ASan and UBSan
        run: |
          set -eux
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -DNF4_TESTING \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/shared src/shared/nf_wal18b7.c src/tests/test_wal18b7.c \
            -o /tmp/nf4_wal_san
          ASAN_OPTIONS=detect_leaks=0 /tmp/nf4_wal_san
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/shared src/shared/nf_governor18b7.c src/tests/test_governor18b7.c \
            -o /tmp/nf4_governor_san
          ASAN_OPTIONS=detect_leaks=0 /tmp/nf4_governor_san
