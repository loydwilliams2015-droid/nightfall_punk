name: H319 O1 ONI multi-cell transport (research only)
on:
  pull_request:
    paths:
      - 'src/shared/nf_retc_h319_material_transport.h'
      - 'src/tests/test_retc_h319_material_transport.c'
      - '.github/workflows/retc-h319-material-transport.yml'
  workflow_dispatch:
jobs:
  multi-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build source A5 and strict C11 simultaneous ledger
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cmake -S . -B build-h319-o1 -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-h319-o1 --parallel 2 --target nightfall_contact_lab
          "$CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/shared \
            src/tests/test_retc_h319_material_transport.c \
            build-h319-o1/libnightfall_contact_lab.a -lm -o build-h319-o1/o1
      - name: Verify source-snapshot conservation and nine negative controls
        run: |
          set -euo pipefail
          build-h319-o1/o1 2>&1 | tee build-h319-o1/o1.log
          grep -Fx 'H319 O1_TRANSPORT_COMPLETE steps=64 applied=128 refused=9 mass=4000 thermal=24000 order_invariant=1 rollback=1 source_A5=1 A6_owner=0 B2_grants=0 B3_effects=0' build-h319-o1/o1.log
