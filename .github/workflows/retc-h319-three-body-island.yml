name: H319 three-body A4 island deterministic lab (NOT owner acceptance)
on:
  pull_request:
    paths:
      - 'src/tests/test_retc_h319_three_body_island.c'
      - 'src/tests/test_retc_h319_shared_contact.c'
      - 'src/shared/nf_retc_h319_shared_contact.h'
      - 'src/shared/nf_contact18a4.*'
      - 'src/shared/nf_contact18a3.*'
      - '.github/workflows/retc-h319-three-body-island.yml'
  workflow_dispatch:
jobs:
  island:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build bounded physics library and test with strict C11
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cmake -S . -B build-h319-island -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-h319-island --parallel 2 --target nightfall_contact_lab
          "$CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/shared \
            src/tests/test_retc_h319_three_body_island.c \
            build-h319-island/libnightfall_contact_lab.a -lm -o build-h319-island/island
      - name: Run order-invariant shared-crate island with duplicate denial
        run: |
          set -euo pipefail
          build-h319-island/island 2>&1 | tee build-h319-island/island.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("build-h319-island/island.log").read_text()
          rows=re.findall(r"H319 ISLAND case=(\d+) status=(\d+) contacts=(\d+) order_invariant=1 duplicate_denied=1",s)
          assert len(rows)==20 and {int(x[0]) for x in rows}==set(range(20))
          complete=re.findall(r"H319 ISLAND_COMPLETE cases=20 accepted=(\d+) pending=(\d+) order_invariant=1 duplicate_denied=1 A6_owner=0 B2_grants=0 B3_effects=0",s)
          assert len(complete)==1
          assert sum(map(int,complete[0]))==20
          print("H319 THREE-BODY ISLAND DIAGNOSTIC PASS: no owner authorization claimed")
          PY
      - name: Require at least one genuine dual swept-contact success
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          "$CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/shared \
            src/tests/test_retc_h319_shared_contact.c \
            build-h319-island/libnightfall_contact_lab.a -lm -o build-h319-island/shared
          build-h319-island/shared 2>&1 | tee build-h319-island/shared.log
          grep -E '^H319 SHARED cases=20 accepted=[1-9][0-9]* pending=[0-9]+ refusal_controls=4 owner=0$' build-h319-island/shared.log
      - name: Archive both island and discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h319-shared-contact-${{ matrix.cc }}
          path: build-h319-island/*.log
          if-no-files-found: warn
