name: RET-C H152-H156 nearby actor source eligibility probe
on:
  push:
    branches: [engineering/retc-h152-h156-nearby-b2-eligibility]
  workflow_dispatch:
jobs:
  gcc-real-game:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Source SHA and clean checkout
        run: |
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libsodium-dev xvfb file
      - name: Build complete actual Linux game
        run: |
          cmake -S . -B build-c2-real -DCMAKE_BUILD_TYPE=Release \
            -DNF_BUILD_CLIENT=ON -DNF_BUILD_SERVER=ON -DNF_BUILD_TESTS=ON
          cmake --build build-c2-real --parallel 2
      - name: Test complete real-game suite
        run: ctest --test-dir build-c2-real --output-on-failure --output-junit retc-c2-real.xml
      - name: Build complete RET-C research suite
        run: |
          cmake -S . -B build-c2-retc -DCMAKE_BUILD_TYPE=Debug -DNF_CONTACT_LAB_ONLY=ON
          cmake --build build-c2-retc --parallel 2
      - name: Test cumulative RET-C research suite
        run: ctest --test-dir build-c2-retc --output-on-failure --output-junit retc-c2-retc.xml
      - name: Preserve head-specific regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-h152-h156-gcc-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-c2-real/retc-c2-real.xml
            build-c2-retc/retc-c2-retc.xml
  clang-research-and-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compile Clang C11 RET-C
        run: |
          cmake -S . -B build-c2-clang -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DNF_CONTACT_LAB_ONLY=ON
          cmake --build build-c2-clang --parallel 2
      - name: Execute independent Clang cumulative regression
        run: ctest --test-dir build-c2-clang --output-on-failure --output-junit retc-c2-clang.xml
      - name: Preserve exact Clang results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-h152-h156-clang-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: build-c2-clang/retc-c2-clang.xml
