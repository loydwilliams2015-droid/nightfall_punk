name: RET-C H319 A4/A5 pair source lab (NOT A6 acceptance)
on:
  pull_request:
    paths:
      - 'src/tests/test_retc_h319_pair_a4_a5_lab.c'
      - '.github/workflows/retc-h319-pair-lab.yml'
  workflow_dispatch:
jobs:
  source-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile source C11 A4 and A5 library
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build-h319-pair -DCMAKE_BUILD_TYPE=Debug -DNF_CONTACT_LAB_ONLY=ON
          cmake --build build-h319-pair --parallel 2 --target nightfall_contact_lab
          "$CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/shared \
            src/tests/test_retc_h319_pair_a4_a5_lab.c \
            build-h319-pair/libnightfall_contact_lab.a -lm -o build-h319-pair/h319-pair
      - name: Execute source pair/epoch controls, no A6 claim
        run: |
          git rev-parse HEAD
          set -euo pipefail
          build-h319-pair/h319-pair 2>&1 | tee build-h319-pair/h319.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("build-h319-pair/h319.log").read_text()
          rows=re.findall(r"H319 A4_PAIR case=(\\d+) actor=(\\d+) target=2010 status=(\\d+) swept=(\\d+) impulse_applied=(\\d+) contact_id=(\\d+) toi=([-+0-9.eE]+) source_tick=(\\d+) source_version=(\\d+)",text)
          assert len(rows)==40, f"Expected 40 source-pair observations, got {len(rows)}"
          assert {(int(r[0]),int(r[1])) for r in rows}=={(i,a) for i in range(20) for a in (10,20)}
          assert all(int(r[7])==17 and int(r[8])==4 for r in rows)
          matches=re.findall(r"H319 LAB_SOURCE_COMPLETE configurations=20 applied_pairs=(\\d+) dual_impulse_candidates=(\\d+) noncontact=(\\d+) material_controls=4 A6_owner=0 B2_grants=0 B3_effects=0",text)
          assert len(matches)==1, "Missing explicit non-authoritative diagnostic completion"
          applied,dual,noncontact=map(int,matches[0])
          assert applied+noncontact==40 and 0<=dual<=20, (applied,dual,noncontact)
          print("H319 DIAGNOSTIC LOG PASS: 40 source-pair rows; NO A6/B2/B3 acceptance")
          PY
