name: RET-C H319 same-source dual PUSH feasibility research
on:
  pull_request:
    paths:
      - 'src/tests/test_v18c2_retc_real_twotick.c'
      - '.github/workflows/retc-h319-source-grid.yml'
  workflow_dispatch:
jobs:
  h319-source-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build source exact A6 A4 A5 B2 test
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cmake -S . -B build-h319 -DCMAKE_BUILD_TYPE=Debug -DNF_CONTACT_LAB_ONLY=ON
          cmake --build build-h319 --parallel 2 --target nightfall_v18c2_retc_real_twotick_test
      - name: Run genuine sixty-four-pose A4 B2 source intersection
        run: |
          set -euo pipefail
          build-h319/nightfall_v18c2_retc_real_twotick_test 2>&1 | tee build-h319/h319.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("build-h319/h319.log").read_text()
          rows=re.findall(r"H319 SOURCE_GRID case=(\d+) side=(\d+) dx_mm=(-?\d+) z_mm=(\d+) a4=([01]) b10=(\d+) b20=(\d+) reason20=(\d+) joint=([01]) preserved=1",s)
          assert len(rows)==64,len(rows)
          assert {int(row[0]) for row in rows}==set(range(64))
          totals=re.findall(r"H319 SOURCE_GRID_COMPLETE cases=64 a4=(\d+) dual_b2=(\d+) intersection=(\d+) pending20=(\d+) occluded20=(\d+) order_differences=(\d+) reverse_dual=(\d+) restored=1",s)
          assert len(totals)==1,totals
          a4,grants,joint,pending,occluded,diffs,reverse_dual=map(int,totals[0])
          assert a4==sum(int(row[4]) for row in rows)
          assert joint==sum(int(row[8]) for row in rows)
          assert 0<=joint<=min(a4,grants)<=64
          assert pending+occluded<=64
          assert 0<=diffs<=64 and 0<=reverse_dual<=64
          reverse_rows=re.findall(r"H319 REVERSE_ORDER case=(\d+) forward10=(\d+) reverse10=(\d+) forward20=(\d+) reverse20=(\d+) reason20=(\d+) reverse_reason20=(\d+) same=([01]) preserved=1",s)
          assert len(reverse_rows)==64,len(reverse_rows)
          assert {int(x[0]) for x in reverse_rows}==set(range(64))
          assert sum(1-int(x[7]) for x in reverse_rows)==diffs
          assert sum(int(x[2])==0 and int(x[4])==0 for x in reverse_rows)==reverse_dual
          assert "H317 OPPOSITE_APPROACH_COMPLETE cases=10 joint_positive=" in s
          print("H319 observed genuine A4 source pairs",a4)
          print("H319 B2 dual proposals",grants)
          print("H319 valid same-pose A4/B2 intersection",joint)
          print("H319 second-actor pending/occluded",pending,occluded)
          print("H319 reverse proposal-order differences",diffs)
          print("H319 reverse dual-eligible proposals",reverse_dual)
          peer=re.findall(r"H319B PEER_APPROACH case=(\d+) dx_mm=(-?\d+) z_mm=(\d+) a4=([01]) b10=(\d+) b20=(\d+) reason20=(\d+) joint=([01]) preserved=1",s)
          assert len(peer)==32,len(peer)
          assert {int(x[0]) for x in peer}==set(range(32))
          summary=re.findall(r"H319B PEER_APPROACH_COMPLETE cases=32 a4=(\d+) dual_b2=(\d+) intersection=(\d+) restored=1",s)
          assert len(summary)==1,summary
          p_a4,p_dual,p_joint=map(int,summary[0])
          assert p_a4==sum(int(x[3]) for x in peer)
          assert p_dual==sum(int(x[4])==0 and int(x[5])==0 for x in peer)
          assert p_joint==sum(int(x[7]) for x in peer)
          assert 0<=p_joint<=min(p_a4,p_dual)<=32
          print("H319B peer-origin approach A4/dual/intersection",p_a4,p_dual,p_joint)
          balanced=re.findall(r"H319C BALANCED_CLOSE case=(\d+) dx_mm=(-?\d+) z_mm=(\d+) a4=([01]) b10=(\d+) b20=(\d+) reason20=(\d+) joint=([01]) preserved=1",s)
          assert len(balanced)==32,len(balanced)
          assert {int(x[0]) for x in balanced}==set(range(32))
          balanced_summary=re.findall(r"H319C BALANCED_CLOSE_COMPLETE cases=32 a4=(\d+) dual_b2=(\d+) intersection=(\d+) restored=1",s)
          assert len(balanced_summary)==1,balanced_summary
          b_a4,b_dual,b_joint=map(int,balanced_summary[0])
          assert b_a4==sum(int(x[3]) for x in balanced)
          assert b_dual==sum(int(x[4])==0 and int(x[5])==0 for x in balanced)
          assert b_joint==sum(int(x[7]) for x in balanced)
          assert 0<=b_joint<=min(b_a4,b_dual)<=32
          print("H319C balanced closing A4/dual/intersection",b_a4,b_dual,b_joint)
          raw=re.findall(r"H319D RAW_PAIR case=(\d+) status=(\d+) count=(\d+) impacts=(\d+) matched=(\d+) disagreed=(\d+) unresolved=(\d+) stage=([01]) preserved=1",s)
          assert len(raw)==32,len(raw)
          assert {int(x[0]) for x in raw}==set(range(32))
          raw_summary=re.findall(r"H319D RAW_PAIR_COMPLETE cases=32 raw_impacts=(\d+) matched=(\d+) disagree_or_unresolved=(\d+) stage_a4=(\d+) restored=1",s)
          assert len(raw_summary)==1,raw_summary
          raw_impacts,matched,disagreed,stage=map(int,raw_summary[0])
          assert raw_impacts==sum(int(x[3])==1 for x in raw)
          assert matched==sum(int(x[4])==1 for x in raw)
          assert disagreed==sum(int(x[5])!=0 or int(x[6])!=0 for x in raw)
          assert stage==sum(int(x[7]) for x in raw)
          assert stage<=raw_impacts
          print("H319D raw solver impacts/matched/disagreement/stage",raw_impacts,matched,disagreed,stage)
          print("H319 scope is research observation only, not two actor-to-object PUSH or publication")
          PY
