name: nightfall v1.6 CI

on:
  push:
    branches: [ main, "build/**", "agent/**" ]
  pull_request:
    branches: [ main, "build/**" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config libsodium-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
      - name: v1.6 standard check
        run: bash ./v16.sh standard-check
      - name: Strict graphical compile including v1.6 proof
        run: bash ./v16.sh build
      - name: All inherited plus v1.6 CTests
        run: bash ./v16.sh test
      - name: Four-client plus bounded-pressure Human Rival combat smoke
        run: ./nightfall.sh combat-smoke
      - name: Passive player versus Human Rival encounter smoke
        run: ./nightfall.sh encounter-smoke
      - name: Situated Human Rival spatial ecology smoke
        run: ./nightfall.sh spatial-smoke
      - name: Dream Cattler habitat and pack ecology smoke
        run: ./nightfall.sh cattler-smoke
      - name: Topographical energy accounting smoke
        run: ./nightfall.sh energy-smoke
      - name: Topographic lifeworld and epistemic-boundary smoke
        run: ./nightfall.sh lifeworld-smoke
      - name: Contamination stasis inventory and transport smoke
        run: ./nightfall.sh contamination-smoke
      - name: Named relational camera proof
        run: bash ./v16.sh test >/dev/null
      - name: Named v1.6 Weapon Solution proof
        run: bash ./v16.sh v16-smoke
