name: MA01C2 MA022 ordered TOI and real B2 witness H1
on:
  push:
    branches: [engineering/v18c1-ma01c2-ma022-h1]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          cmake -S . -B /tmp/next2 -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build /tmp/next2 --parallel 2
          ctest --test-dir /tmp/next2 --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/shared src/shared/nf_contact18a.c src/shared/nf_contact18a2.c src/shared/nf_contact18a3.c src/shared/nf_contact18a4.c src/shared/nf_contact18a5.c src/shared/nf_contact18a5_close.c src/shared/nf_contact18a5_wal.c src/shared/nf_eligibility18b2.c src/shared/nf_multi_c1_next.c src/shared/nf_multi_next2.c src/tests/test_multi_next2.c -lm -o /tmp/next2san
          ASAN_OPTIONS=detect_leaks=0 /tmp/next2san
