name: spiral09-contract
on:
  pull_request:
    paths:
      - 'tools/spiral08/**'
      - 'tools/spiral09/**'
      - '.github/workflows/spiral09-contract.yml'
  push:
    branches:
      - engineering/spiral08-map-render-consumer-gates
    paths:
      - 'tools/spiral08/**'
      - 'tools/spiral09/**'
      - '.github/workflows/spiral09-contract.yml'
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute Spiral 08
        run: |
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Werror -pedantic tools/spiral08/test_spiral08_consumer.c -lm -o /tmp/spiral08
          /tmp/spiral08
      - name: Compile and execute Spiral 09
        run: |
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Werror -pedantic tools/spiral09/test_spiral09_bundle.c -lm -o /tmp/spiral09
          /tmp/spiral09
      - name: UBSan Spiral 09
        run: |
          ${{ matrix.compiler }} -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all tools/spiral09/test_spiral09_bundle.c -lm -o /tmp/spiral09_ubsan
          /tmp/spiral09_ubsan
