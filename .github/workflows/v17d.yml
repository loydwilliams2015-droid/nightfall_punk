name: nightfall v1.7D cleave CI

on:
  push:
    branches: [ "build/v1.7d-cleave" ]
  pull_request:
    branches: [ "build/v1.7d-cleave" ]

jobs:
  v17d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install strict C/CMake toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3
      - name: Historical cumulative regression
        run: bash ./v17d.sh regression
      - name: Configure 1.7 logic-only CMake build
        run: >
          cmake -S . -B build/cmake-v17d
          -DNF_BUILD_CLIENT=OFF
          -DNF_BUILD_SERVER=OFF
          -DNF_BUILD_NETBOT=OFF
          -DNF_BUILD_TESTS=ON
      - name: Build full shared logic lineage
        run: cmake --build build/cmake-v17d --parallel 2
      - name: Run CTest
        run: ctest --test-dir build/cmake-v17d --output-on-failure
