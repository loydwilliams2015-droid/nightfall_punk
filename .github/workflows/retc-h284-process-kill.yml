name: H284 process-kill joint persistence matrix
on:
  pull_request:
    paths:
      - '.github/workflows/retc-h284-process-kill.yml'
      - 'src/tests/test_v18c2_retc_real_twotick.c'
      - 'src/shared/nf_c2_retc_frame.c'
  workflow_dispatch:

jobs:
  source-process-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Exact SHA and C3 interface source fingerprint
        run: |
          git rev-parse HEAD
          sha256sum src/shared/nf_c2_retc_frame.c src/tests/test_v18c2_retc_real_twotick.c
      - name: Build actual A6 B2/B3 source owner C test
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build-h284 -DCMAKE_BUILD_TYPE=Debug -DNF_CONTACT_LAB_ONLY=ON
          cmake --build build-h284 --parallel 2 --target nightfall_v18c2_retc_real_twotick_test
      - name: Six by five forked real transaction kill trials
        run: |
          set -euo pipefail
          build-h284/nightfall_v18c2_retc_real_twotick_test --crash-matrix 2>&1 | tee h284-crash.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          s=Path("h284-crash.log").read_text()
          rows=re.findall(r"H284 PROCESS_KILL case=(\d+) group=(\d+) point=(\d+) recovered_epoch=(\d+)",s)
          gaps=re.findall(r"H284 PREPUBLICATION_GAP case=(\d+) disk_epoch=2 live_epoch=1",s)
          assert len(rows)==30,rows
          for case,grp,point,epoch in rows:
              c=int(case);p=int(point)
              assert int(grp)==c//5 and p==c%5+1
              assert int(epoch)==(2 if p==5 else 1)
          assert len({int(r[0]) for r in rows})==30
          assert sorted(int(c) for c in gaps)==[4,9,14,19,24,29],gaps
          assert "H284 PROCESS_MATRIX PASS killed=30 before_rename=24 after_rename=6 disk_live_gap=6" in s
          assert "RET-C real A6 dispatcher two consecutive committed joint ticks PASS" in s
          result={
             "source_owned_attempts":30,"confirmed_process_terminations":30,
             "pre_rename_prior_complete_epoch":24,
             "after_rename_new_complete_epoch_without_live_publish":6,
             "result":"PASS for fault-window characterization; C3 atomic restart NOT PROVEN",
             "scope":"forked child process crash simulation on a real B2/B3 second authoritative tick",
             "still_open":["whole-owner process restart","directory durability","multi-actor durable B2/B3",
                           "portable versioned envelope","power loss","real TSAN"]
          }
          Path("h284-crash.json").write_text(json.dumps(result,indent=2)+"\n")
          print("H284 PROCESS-CRASH CHARACTERIZATION PASS 30/30; 6 disk/live gaps CONFIRMED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h284-source-crash-${{ matrix.compiler }}
          path: |
            h284-crash.log
            h284-crash.json
          if-no-files-found: warn
          retention-days: 14
