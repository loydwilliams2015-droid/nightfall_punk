name: MA03E MA02-6 off-axis contact research
on:
  push:
    branches: [engineering/v18c1-ma03e-ma026-h1]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B /tmp/ma03e -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build /tmp/ma03e --parallel 2
          ctest --test-dir /tmp/ma03e --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B /tmp/ma03es -DNF_CONTACT_LAB_ONLY=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build /tmp/ma03es --parallel 2
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir /tmp/ma03es --output-on-failure
