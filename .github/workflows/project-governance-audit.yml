name: Project governance audit

on:
  pull_request:
  push:
    branches:
      - "stewardship/**"
      - "integration/**"
      - "build/**"
      - "design/**"

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Governance and artifact audit
        run: python3 tools/project_audit.py
