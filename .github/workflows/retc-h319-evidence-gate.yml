name: RET-C H319 schema guard (NOT physics acceptance)
on:
  pull_request:
    paths:
      - 'tools/retc_h319_evidence_gate.py'
      - 'tests/test_retc_h319_evidence_gate.py'
      - '.github/workflows/retc-h319-evidence-gate.yml'
  workflow_dispatch:
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run diagnostic-only regression suite
        run: python3 -m unittest discover -s tests -p 'test_retc_h319_evidence_gate.py' -v
